domain:
  id: native_retained_distinction_graph
  title: Native URR-C Two-Node Retained-Distinction Domain
  external_adapter_used: false
  semantics_status: internal_meaning_cards
  description: >-
    A dimensionless native URR-C domain. Variables are assigned roles inside
    retained-distinction theory, not identified with voltage, temperature,
    position, or another external-domain quantity.

cards:
  Phi_i:
    meaning: reader-state distinction amplitude at relation node i
    unit: native_distinction_unit
  Psi_i:
    meaning: mirror-record distinction amplitude paired with Phi_i
    unit: native_record_unit
    boundary: universal ontic record status remains Open
  node_0:
    meaning: declared directly readable relation node
  node_1:
    meaning: declared hidden relation node
  L_R:
    meaning: native relation grammar coupling the two nodes
  M:
    meaning: resistance to second difference in the native recurrence
  D:
    meaning: reader damping and mirror anti-damping coefficient
  K:
    meaning: relation-grammar coupling strength
  k2:
    meaning: local restoring coefficient
  W:
    meaning: write coefficient from readable node to hidden node
  R_return:
    meaning: return coefficient from hidden node to readable node
  Lambda_T:
    meaning: hidden-to-tape extraction coefficient
  tape_cell_n:
    meaning: append-only record of hidden extraction at step n
  K_return_h:
    meaning: message-to-future-report operator generated by full native dynamics
  y_h:
    meaning: reported native distinction vector

non_identifications:
  - Phi_is_not_declared_voltage
  - Phi_is_not_declared_temperature
  - Phi_is_not_declared_position
  - Psi_is_not_proven_to_be_a_universal_physical_record
  - coefficients_have_no_external_physical_units

claim_boundary:
  internal_semantics: definition
  numerical_execution: finite_diagnostic
  physical_validation: not_claimed
  unified_DRL_cut_tape_action: Open
