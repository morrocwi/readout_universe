name: compile-rrhm-arxiv

on:
  push:
    paths:
      - '.github/workflows/compile_rrhm_arxiv.yml'
      - 'scripts/build_rrhm_arxiv.py'
      - 'papers/why_we_phobia_RRHM_full_medical_journal_v3.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended latexmk poppler-utils

      - name: Generate two-column arXiv-style source
        run: python3 scripts/build_rrhm_arxiv.py

      - name: Compile PDF
        run: |
          cd papers
          latexmk -pdf -interaction=nonstopmode -halt-on-error why_we_phobia_RRHM_full_medical_journal_arxiv_v1.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error why_we_phobia_RRHM_full_medical_journal_arxiv_v1.tex

      - name: Basic PDF quality checks
        run: |
          test -s papers/why_we_phobia_RRHM_full_medical_journal_arxiv_v1.pdf
          pdfinfo papers/why_we_phobia_RRHM_full_medical_journal_arxiv_v1.pdf | head -20
          ls -lh papers/why_we_phobia_RRHM_full_medical_journal_arxiv_v1.pdf

      - name: Commit generated TeX and PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/why_we_phobia_RRHM_full_medical_journal_arxiv_v1.tex papers/why_we_phobia_RRHM_full_medical_journal_arxiv_v1.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Build arXiv-style two-column RRHM manuscript PDF'
            git push
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: RRHM-arxiv-two-column-PDF
          path: papers/why_we_phobia_RRHM_full_medical_journal_arxiv_v1.pdf
          if-no-files-found: error
