name: verify

# push only, deliberately -- NOT pull_request. This workflow runs on a
# self-hosted runner; a pull_request trigger on a public repo would let any
# external fork PR execute arbitrary code on that machine (a well-documented
# GitHub Actions anti-pattern for self-hosted runners + public repos). If
# PR-triggered CI is ever needed, gate it behind repo Settings > Actions >
# "Require approval for all outside collaborators" first, and prefer
# pull_request_target with no untrusted checkout over a bare pull_request
# trigger.
on: [push]

# Runs on a self-hosted runner rather than a GitHub-hosted one, so the Coq
# toolchain is installed once instead of rebuilt every run.
#
# Coq is PINNED to 8.20.1. The pin is enforced by CHECKING the installed
# version and failing loudly on drift, rather than by reinstalling on every
# run -- strictly stronger than an unpinned `apt-get install -y coq` (which
# drifts silently with the base image) and cheaper than a per-run opam
# rebuild. Single pinned version, no build matrix.
jobs:
  verify:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Enforce the Coq pin (fail loudly on drift)
        run: |
          set -euo pipefail
          coqc --version
          coqc --version | grep -q "version 8\.20\.1" || {
            echo "::error::Coq version drift: this repo's claims are certified against 8.20.1"
            exit 1
          }

      # The runner's PATH points at the same miniforge python the repo's runs were
      # recorded with (docs/VERIFIED_RUNS.md), not /usr/bin/python3 -- which on this
      # machine has no pip at all. Verify that before trusting anything downstream.
      - name: Show and check the interpreter
        run: |
          set -euo pipefail
          which python3
          python3 -c "import sys; print(sys.executable, sys.version.split()[0])"
          python3 -c "import numpy, scipy, sympy, pytest" || {
            echo "::error::declared dependencies missing from the runner interpreter"
            exit 1
          }

      - name: Run CI gate (LTP battery + UPL_Sorites.v + evidence/*.v + pytest + gate-typing self-test + gate-typing law)
        run: bash scripts/ci_verify.sh
