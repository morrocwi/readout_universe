peer_review_0_4:
  recommendation: major_revision
  framework_value: promising
  fundamental_physics_claim: unsupported_at_present
  individual_mathematical_novelty: not_established
  conjunction_novelty: Open
  required_next_evidence:
    - "formal verification of forced typing and AP17 identities"
    - "calibrated RC, thermal, and oscillator datasets"
    - "comparison with independent system-identification baselines"
    - "nonlinear out-of-sample return predictions"
    - "external human review before novelty promotion"

open:
  - "mechanistic reader-to-record handoff in the linear DRL"
  - "unified action for DRL, directed cuts, and injective tape"
