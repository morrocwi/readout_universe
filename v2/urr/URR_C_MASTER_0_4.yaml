system:
  id: URR-C
  name: Universal Retention-Cut-Return-Readout System
  version: 0.4.1-detailed-yaml
  date: 2026-07-20
  language: English
  document_role: canonical_machine_readable_master_contract
  human_readable_companion: v2/urr/URR_C_MASTER_0_4.md
  status:
    overall: candidate_computational_architecture
    native_drl: derived_narrow
    forced_cut_extension: Dr
    linear_hidden_elimination: exact_algebra_in_declared_scope
    linear_return_kernel: exact_algebra_in_declared_scope
    linear_Gaussian_readability: exact_under_declared_distribution
    ap17_runtime: finite_diagnostic
    nonlinear_return: local_linearization_only
    unified_drl_cut_tape_action: Open

binding_rule:
  statement: Never promote a claim above its evidence tier.
  consequences:
    - Numerical agreement remains finite_diagnostic unless independently proved.
    - A declared bridge or interpretation remains Dr until derived.
    - A finite zero-return observation does not prove permanent inaccessibility.
    - A one-way native cut does not certify a gravitational event horizon.
    - A linear-Gaussian identity is not universal outside its declared assumptions.

development_logic:
  failed_collapses:
    readout_equals_truth:
      rejected_statement: A reported readout is identical to the complete physical state.
      correction: A readout is generated by a declared operator, apparatus, noise model, decoder, threshold, and reporting policy.
    readable_loss_equals_destruction:
      rejected_statement: Quantity lost from the readable sector has been destroyed.
      correction: AP15 provides a finite positive-flow counterexample in which readable quantity decreases while total readable-hidden-tape quantity is conserved.
    unreadable_equals_physical_black_hole:
      rejected_statement: Every unreadable state is inside a physical black hole.
      correction: Blind sensors and one-way retained sinks are unreadable counterexamples without a geometric horizon certificate.
    return_equals_original_form:
      rejected_statement: Information returns only when the measured form is approximately identical to the original form.
      correction: AP17 shows that a return operator can be far from the identity while a declared decoder reconstructs the original message.
  upgraded_primitive_question: >-
    What was written, how did it evolve, through which channel did it return,
    and how much can a declared physical readout reconstruct?
  core_distinctions:
    - existence
    - retention
    - direct_accessibility
    - dynamical_influence
    - returned_signal
    - decodability
    - reported_output
  non_equivalence_chain: >-
    retained != directly_accessible != dynamically_influential != returned
    != decodable != reported

notation:
  time:
    discrete_index: n
    discrete_step: Delta_t
    continuous_time: t
    return_delay: tau
    observation_window_length: L
  spaces:
    retained_space:
      symbol: "\\mathscr H_T"
      description: finite native retained state space
    doubled_reader_record_space:
      symbol: "\\mathscr X_T"
      equation: "\\mathscr X_T = \\mathscr H_T \\oplus \\mathscr H_T"
      description: doubled DRL space containing reader and mirror-record variables
    message_space:
      symbol: "\\mathscr Z"
      description: space of encoded perturbations or messages
    tape_space:
      symbol: "\\mathscr T_n"
      description: possibly growing append-only record space
  states:
    doubled_state:
      symbol: X_n
      equation: "X_n = (Phi_n, Psi_n)^T"
    reader_state:
      symbol: Phi_n
      description: directly propagated physical reader variable
    mirror_state:
      symbol: Psi_n
      description: doubled partner with opposite damping sign in the native DRL equations
    visible_state:
      symbol: x_O
      description: readable working state in a linear visible-hidden adapter
    hidden_state:
      symbol: x_H
      description: retained working state not directly read by the declared sensor
    encoded_message:
      symbol: z
      description: message or perturbation before write-channel encoding
  selectors:
    reader_selector:
      symbol: P_Phi
      equation: "P_Phi = (I, 0)"
      action: "P_Phi X = Phi"
    mirror_selector:
      symbol: P_Psi
      equation: "P_Psi = (0, I)"
      action: "P_Psi X = Psi"

readout_decomposition:
  base_projectors:
    accessible:
      symbol: O_alpha
      equations:
        - "O_alpha^2 = O_alpha"
      interpretation: sector directly accessible to readout policy alpha
    hidden:
      symbol: H_alpha
      equations:
        - "H_alpha = I - O_alpha"
        - "H_alpha^2 = H_alpha"
        - "O_alpha H_alpha = 0"
      interpretation: retained directions not directly accessible to readout alpha
  lifted_projectors:
    accessible:
      symbol: Obar_alpha
      equation: "Obar_alpha = I_2 tensor O_alpha"
    hidden:
      symbol: Hbar_alpha
      equation: "Hbar_alpha = I_X - Obar_alpha"
    purpose: >-
      Lift the readable-hidden decomposition to the doubled reader-record
      state so the cut is typed on both Phi and Psi.

native_grammar:
  symbol: "\\mathbb G_T"
  equation_latex: >-
    \mathbb G_T =
    L_R \otimes I_{\mathcal F}
    + I_{\mathcal R} \otimes C_{\mathcal F}
    + C_{\rm int}
  components:
    relation_operator:
      symbol: L_R
      description: graph Laplacian or declared finite relation operator
    fiber_operator:
      symbol: C_F
      description: internal operator acting within each relation node
    interaction_correction:
      symbol: C_int
      description: declared coupling not captured by the separable tensor terms
    coupling_scale:
      symbol: K
      description: scale multiplying the grammar force in the DRL equations

native_drl_action:
  symbol: S_DRL
  equation_latex: >-
    S_{\rm DRL}[X] = \sum_n \mathbb L^n
  discrete_increments:
    reader: "Delta Phi_n = Phi_{n+1} - Phi_n"
    mirror: "Delta Psi_n = Psi_{n+1} - Psi_n"
  component_lagrangian_latex: |-
    \begin{aligned}
    \mathbb L^n ={}&
    \frac{1}{\Delta t}\Delta\Phi_n^T M\Delta\Psi_n
    +\frac12\left(
    \Phi_n^T D\Delta\Psi_n
    -\Psi_n^T D\Delta\Phi_n
    \right)\\
    &-\Delta t\left[
    K\Phi_n^T\mathbb G_T\Psi_n
    +\Psi_n^T\nabla V(\Phi_n)
    -J_n^T\Psi_n
    \right].
    \end{aligned}
  terms:
    inertial_pairing:
      expression: "(1/Delta_t) Delta_Phi_n^T M Delta_Psi_n"
      interpretation: reader-mirror inertial pairing
    antisymmetric_damping:
      expression: "1/2 (Phi_n^T D Delta_Psi_n - Psi_n^T D Delta_Phi_n)"
      interpretation: generates +D damping for Phi and -D damping for Psi
    grammar_coupling:
      expression: "K Phi_n^T G_T Psi_n"
      interpretation: couples reader and mirror through the native relation-fiber grammar
    nonlinear_force:
      expression: "Psi_n^T grad V(Phi_n)"
      interpretation: produces grad V in the reader equation and Hess V times Psi in the mirror equation
    external_source:
      expression: "-J_n^T Psi_n"
      interpretation: produces source J_n in the reader equation
  evidence:
    tier: derived_narrow
    references:
      - v2/urr/URR_NATIVE_TECHNICAL_SPEC.md
      - evidence/DRL_Discrete.v
      - evidence/DRL_General_Legendre.v
  limitation: >-
    The native action does not yet derive the directed cut, tape, and return
    operators from one unified variational principle.

balanced_read_write_cut:
  write_operator:
    symbol: W_beta_n
    type: "im(Obar_beta) -> im(Hbar_beta)"
    interpretation: writes readable doubled-state content into the hidden sector
  return_operator:
    symbol: R_alpha_n
    type: "im(Hbar_alpha) -> im(Obar_alpha)"
    interpretation: returns hidden doubled-state content toward a readable sector
  tape_operator:
    symbol: Lambda_T_alpha_n
    interpretation: removes hidden working content into a declared tape backend
  source_outflow_operators:
    write_outflow:
      symbol: Lambda_W_alpha_n
      interpretation: balances quantity leaving the readable source sector
    return_outflow:
      symbol: Lambda_R_alpha_n
      interpretation: balances quantity leaving the hidden source sector through return
  balanced_force:
    symbol: J_C_n
    equation_latex: |-
      \begin{aligned}
      \mathcal J_{C,n}[X] ={}&
      \bar H W_n\bar OX
      -\bar O\Lambda_{W,n}\bar OX\\
      &+\bar OR_n\bar HX
      -\bar H(\Lambda_{R,n}+\Lambda_{T,n})\bar HX.
      \end{aligned}
    projected_accessible_part: >-
      Obar J_C = -Obar Lambda_W Obar X + Obar R Hbar X
    projected_hidden_part: >-
      Hbar J_C = Hbar W Obar X - Hbar (Lambda_R + Lambda_T) Hbar X
  interpretation:
    write_influx: "Hbar W Obar X"
    readable_source_outflow: "-Obar Lambda_W Obar X"
    return_influx: "Obar R Hbar X"
    hidden_source_outflow: "-Hbar (Lambda_R + Lambda_T) Hbar X"
  tier: Dr
  limitation: cut_force_not_derived_from_S_DRL

cut_balance_certificate:
  retained_quantity:
    retention_covector:
      symbol: rho
      description: declared linear functional defining the quantity claimed to be retained
  required_equation_latex: "\\rho^T \\mathcal J_{C,n}[X] = 0"
  interpretation: >-
    A conservation claim is valid only for a declared retained quantity whose
    covector annihilates the cut force.
  AP15_special_case:
    covector: "rho = 1"
    state_domain: positive_finite_flow_compartments
  forbidden_generalization: >-
    The AP15 positive-flow balance must not be silently promoted to arbitrary
    signed doubled DRL states.

forced_drl_equations:
  architecture_equation_latex: "\\mathcal E_{\\rm DRL}[X]_n = \\mathcal J_{C,n}[X_n]"
  reader_equation_latex: |-
    \begin{aligned}
    &M\frac{\Phi_{n+1}-2\Phi_n+\Phi_{n-1}}{\Delta t^2}
    +D\frac{\Phi_{n+1}-\Phi_{n-1}}{2\Delta t}\\
    &\quad+K\mathbb G_T\Phi_n+\nabla V(\Phi_n)-J_n
    =P_\Phi\mathcal J_{C,n}[X_n].
    \end{aligned}
  mirror_equation_latex: |-
    \begin{aligned}
    &M\frac{\Psi_{n+1}-2\Psi_n+\Psi_{n-1}}{\Delta t^2}
    -D\frac{\Psi_{n+1}-\Psi_{n-1}}{2\Delta t}\\
    &\quad+K\mathbb G_T\Psi_n+\nabla^2V(\Phi_n)\Psi_n
    =P_\Psi\mathcal J_{C,n}[X_n].
    \end{aligned}
  interpretation: >-
    The cut supplies an external generalized force to the native DRL
    Euler-Lagrange equations. It does not replace the DRL dynamics.
  mathematical_class: forced_discrete_variational_system
  analogy: discrete_Lagrange_d_Alembert_system
  tier: Dr
  open_problem: derive_or_reject_from_one_unified_action

continuum_reader_reduction:
  general_equation_latex: >-
    M\partial_t^2\Phi
    +D\partial_t\Phi
    +K\mathbb G_T\Phi
    +\nabla V(\Phi)
    =J+P_\Phi\mathcal J_C
  quadratic_potential_case:
    assumption: "V(Phi) = (k_2/2) ||Phi||^2"
    equation_latex: >-
      M\Phi_{tt}+D\Phi_t+K\mathbb G_T\Phi+k_2\Phi
      =J+P_\Phi\mathcal J_C
  graph_only_case:
    assumption: "G_T = L_R"
    equation_latex: >-
      M\Phi_{tt}+D\Phi_t+K L_R\Phi+k_2\Phi
      =J+P_\Phi\mathcal J_C
  spatial_continuum_case:
    assumption: "L_R -> -nabla^2"
    equation_latex: >-
      M\Phi_{tt}+D\Phi_t-K\nabla^2\Phi+k_2\Phi
      =J+P_\Phi\mathcal J_C
  classification: graph_telegraph_or_reaction_telegraph_type_reduction
  scope_warning: >-
    Telegraph-like is a declared reduction and analogy, not a universal identity
    for every URR-C adapter or every physical system.

record_backends:
  growing_injective_tape:
    equation_latex: >-
      \mathcal T_{n+1}
      =\mathcal T_n\oplus E_{T,n}(\bar H X_n)
    requirements:
      - E_T_n_is_injective_on_the_declared_record_domain
      - tape_state_space_may_grow
    capability: can preserve appended records without overwriting earlier entries
    warning: injectivity_must_be_certified
  fixed_dimensional_accumulator:
    equation_latex: >-
      q_{T,n+1}=q_{T,n}+L_{T,n}\bar H X_n
    requirements_for_monotonic_append_only_claim:
      - declared_positive_state_cone
      - "L_T_n Hbar X_n >= 0"
    capability: accumulates a declared quantity in fixed dimension
    warning: >-
      Equal accumulator values may arise from different histories; an
      accumulator is not automatically an injective historical record.
  binding_distinction: accumulation_is_not_equivalent_to_injective_recording

linear_visible_hidden_adapter:
  equations_latex:
    visible: "\\dot x_O=F_{OO}x_O+Rx_H+B_Ou"
    hidden: "\\dot x_H=Wx_O+F_Hx_H+B_Hu"
    output: "y=Cx_O+\\eta"
  variables:
    F_OO: local visible dynamics
    F_H: local hidden dynamics
    W: visible_to_hidden_write_coupling
    R: hidden_to_visible_return_coupling
    B_O: direct_visible_input_coupling
    B_H: hidden_input_coupling
    C: measurement_matrix
    eta: measurement_noise
    u: external_input
  adapter_status: declared_linear_calculation_adapter
  nonclaim: real_physics_is_not_assumed_to_be_universally_linear

linear_hidden_elimination:
  hidden_solution_latex: |-
    x_H(t)
    =e^{F_H(t-t_0)}x_H(t_0)
    +\int_{t_0}^{t}
    e^{F_H(t-s)}
    [Wx_O(s)+B_Hu(s)]\,ds
  reduced_visible_equation_latex: |-
    \begin{aligned}
    \dot x_O(t)={}&F_{OO}x_O(t)
    +Re^{F_H(t-t_0)}x_H(t_0)\\
    &+\int_{t_0}^{t}K_{\rm mem}(t-s)x_O(s)\,ds\\
    &+B_Ou(t)
    +\int_{t_0}^{t}Re^{F_H(t-s)}B_Hu(s)\,ds.
    \end{aligned}
  memory_kernel:
    symbol: K_mem
    equation_latex: "K_{\\rm mem}(\\tau)=Re^{F_H\\tau}W"
    causal_domain: "tau >= 0"
  separated_effects:
    visible_local_dynamics: "F_OO x_O(t)"
    hidden_initial_state_echo: "R exp(F_H(t-t0)) x_H(t0)"
    visible_state_history_memory: "integral K_mem(t-s) x_O(s) ds"
    direct_visible_input: "B_O u(t)"
    hidden_input_memory: "integral R exp(F_H(t-s)) B_H u(s) ds"
  tier: exact_algebra_in_declared_finite_linear_model
  nonlinear_extension: Open

return_transformation_kernel:
  purpose: >-
    Map an encoded past message or perturbation to the future signal produced
    by a declared return channel and physical readout.
  encoded_message:
    symbol: z
    encoder:
      symbol: E_beta
      type: "message_space -> im(Obar_beta)"
  kernel:
    symbol: K_return_alpha_from_beta
    equation_latex: |-
      \mathcal K_{\alpha\leftarrow\beta}(\tau)
      =
      A_\alpha\bar O_\alpha R_\alpha
      \mathcal U_H(\tau)
      \bar H_\beta W_\beta\bar O_\beta E_\beta
    composition_order:
      - encode_message_with_E_beta
      - select_write_accessible_subspace_with_Obar_beta
      - write_into_hidden_sector_with_W_beta
      - enforce_hidden_subspace_with_Hbar_beta
      - propagate_hidden_state_with_U_H_tau
      - return_with_R_alpha
      - select_readable_subspace_with_Obar_alpha
      - convert_to_measurement_with_A_alpha
  linear_hidden_propagator:
    equation_latex: "\\mathcal U_H(\\tau)=e^{F_H\\tau}"
  causality_gate:
    equation_latex: "\\mathcal K_{\\alpha\\leftarrow\\beta}(\\tau)=0\\quad(\\tau<0)"
  measurement:
    equation_latex: >-
      y_{\alpha\leftarrow\beta}(\tau)
      =\mathcal K_{\alpha\leftarrow\beta}(\tau)z+\eta_\alpha
  relation_to_memory_kernel:
    memory_kernel_question: How does hidden state feed back into visible dynamics?
    return_kernel_question: How does an encoded past perturbation become a measured future signal?
    binding_distinction: memory_feedback_is_not_identical_to_physical_readout_return
  tier: exact_algebra_in_declared_linear_operator_chain

reconstruction_and_form_fidelity:
  binding_principle: returned_form_is_not_identical_to_returned_information
  typed_identity_comparison:
    requirement: units_dimensions_encoder_and_decoder_must_match
    same_form_gate: typed_K_return_approximately_I
  reconstructability:
    noiseless_gate: "D K_return approximately I on the message space"
    full_column_rank_gate: "rank(K_return) = dim(message_space)"
  generalized_least_squares_decoder:
    equation_latex: |-
      D_*=
      (\mathcal K^T\Sigma_\eta^{-1}\mathcal K)^{-1}
      \mathcal K^T\Sigma_\eta^{-1}
    assumptions:
      - K_return_has_full_column_rank
      - Sigma_eta_is_positive_definite
  reconstruction_covariance:
    equation_latex: |-
      \Sigma_{\rm rec}
      =
      (\mathcal K^T\Sigma_\eta^{-1}\mathcal K)^{-1}
  interpretation:
    full_rank_good_conditioning: transformed_but_reconstructable
    full_rank_bad_conditioning: structurally_reconstructable_but_noise_fragile
    rank_deficient: partial_return
    zero_operator: no_direct_return_under_declared_channel
  warning: operator_distance_from_identity_is_not_an_information_measure

finite_window_physical_readability:
  sampled_dynamics:
    state_equation_latex: "x_{k+1}=Fx_k"
    output_equation_latex: "y_k=Cx_k+\\eta_k"
  stacked_measurement:
    equation_latex: "Y_L=\\mathcal G_Lx_0+N_L"
  finite_window_operator:
    symbol: G_L
    equation_latex: |-
      \mathcal G_L=
      \begin{pmatrix}
      C\\CF\\CF^2\\\vdots\\CF^L
      \end{pmatrix}
  structural_readability:
    readable_dimension_latex: "d_{\\rm struct}(L)=\\operatorname{rank}\\mathcal G_L"
    nullity_latex: >-
      \nu_{\rm struct}(L)
      =\dim(x_0)-\operatorname{rank}\mathcal G_L
    structurally_unreadable_direction_gate: "\\mathcal G_Lv=0"
    interpretation: >-
      A state direction invisible in a single snapshot may become readable
      through its later dynamical influence on the measured coordinates.
  noise_whitening:
    operator_latex: >-
      \widetilde{\mathcal G}_L
      =\Sigma_N^{-1/2}\mathcal G_L\Sigma_x^{1/2}
    components:
      Sigma_N: covariance_of_stacked_measurement_noise
      Sigma_x: declared_state_covariance_or_state_scale
  practical_readability:
    threshold_symbol: kappa
    readable_dimension_latex: >-
      d_{\rm readable}^{(\kappa)}(L)
      =
      \#\{i:\sigma_i(\widetilde{\mathcal G}_L)>\kappa\}
    interpretation:
      large_singular_value: easy_to_read
      near_threshold: fragile_readability
      below_threshold: practically_unreadable
      zero_singular_value: structurally_unreadable

linear_Gaussian_readable_information:
  assumptions:
    state_distribution: "x_0 ~ Normal(0, Sigma_x)"
    noise_distribution: "N_L ~ Normal(0, Sigma_N)"
    independence: x_0_independent_of_N_L
    positive_definiteness:
      - Sigma_x_positive_semidefinite
      - Sigma_N_positive_definite
  equation_latex: |-
    I_{\rm read}(L)
    =
    \frac12\log_2\det\left[
    I+
    \Sigma_x^{1/2}
    \mathcal G_L^T\Sigma_N^{-1}
    \mathcal G_L
    \Sigma_x^{1/2}
    \right]\;\mathrm{rbit}
  interpretation: >-
    Policy-conditioned mutual information between the declared initial state
    distribution and the stacked physical measurement history.
  dependencies:
    - state_prior
    - dynamics
    - sensor
    - noise
    - observation_window
  tier: exact_under_declared_linear_Gaussian_channel
  forbidden_generalization: not_a_universal_information_formula_for_all_distributions

memory_and_echo_readouts:
  echo_time:
    equation_latex: >-
      \tau_{\rm echo}
      =
      \operatorname*{arg\,max}_{\tau>0}I_{\rm read}(\tau)
    interpretation: delay_at_which_the_declared_protocol_reads_the_largest_return_information
  memory_lifetime:
    threshold_symbol: I_star
    equation_latex: >-
      \tau_{\rm mem}^{(I_*)}
      =
      \sup\{\tau:I_{\rm read}(\tau)\ge I_*\}
    interpretation: >-
      Last delay at which readable information remains above the declared
      threshold under the declared apparatus and policy.
  qualitative_classes:
    fading_memory: I_read_decreases_monotonically
    delayed_echo: I_read_has_a_later_local_maximum
    structural_loss: rank_or_nullity_gate_fails
    practical_loss: noise_whitened_singular_values_fall_below_threshold
  warning: memory_lifetime_is_policy_dependent_not_an_absolute_destruction_time

classification_gates:
  same_form_return:
    gate: typed_K_return_approximately_identity
  transformed_but_reconstructable:
    gates:
      - K_return_has_full_column_rank
      - Sigma_rec_is_acceptable_under_declared_policy
  partial_return:
    gate: "0 < rank(K_return) < dim(z)"
  delayed_echo:
    gate: delayed_local_maximum_of_I_read_tau
  no_direct_return:
    gate: K_return_equals_zero_for_declared_channel_and_window
    nonclaim: no_direct_return_does_not_prove_no_other_channel_or_no_future_return
  practically_unreadable:
    gate: all_noise_whitened_singular_values_below_kappa
  structurally_unreadable:
    gate: encoded_direction_in_kernel_of_G_L
  physical_black_hole_adapter:
    required_gates:
      - one_way_causal_cut
      - declared_metric
      - declared_causal_structure
      - geometric_horizon_certificate
    forbidden_inference: R_equals_zero_implies_physical_black_hole

hidden_sector_stability:
  spectral_abscissa:
    equation_latex: "\\alpha_H=\\max_i\\Re\\lambda_i(F_H)"
    classes:
      asymptotically_decaying:
        gate: "alpha_H < 0"
        interpretation: hidden_propagator_decays_asymptotically_under_ordinary_stable_conditions
      persistent_or_oscillatory:
        gate: "alpha_H = 0"
        interpretation: persistent_or_oscillatory_memory_may_occur
      linearly_growing:
        gate: "alpha_H > 0"
        interpretation: growth_requires_a_finite_horizon_saturation_model_or_explicit_instability_claim
  transient_growth:
    equation_latex: >-
      g_H(T)=
      \sup_{0\le\tau\le T}\|e^{F_H\tau}\|
    purpose: detect_nonnormal_transient_amplification_even_when_alpha_H_is_negative
  reporting_requirements:
    - eigenvalues_or_spectral_abscissa
    - finite_horizon_transient_growth
    - conditioning_of_return_and_decoder_operators

nonlinear_extension:
  hidden_dynamics_latex: "\\dot x_H=f_H(x_H,x_O,u)"
  exact_status: >-
    The exact nonlinear return is generally a trajectory-dependent nonlinear
    response functional rather than a stationary matrix convolution kernel.
  tangent_propagator_latex: |-
    \partial_tU_H(t,s)
    =
    \left.
    \frac{\partial f_H}{\partial x_H}
    \right|_{x(t)}
    U_H(t,s),
    \qquad
    U_H(s,s)=I
  tangent_return_kernel_latex: >-
    \mathcal K_{\rm tangent}(t,s)
    =
    A(t)R(t)U_H(t,s)W(s)E(s)
  interpretation: local_response_of_small_perturbations_along_a_declared_trajectory
  tier: local_linearization_only
  universal_nonlinear_return_theorem: Open

reporting_policy:
  residual_or_measurement_window:
    symbol: Y_L
  report:
    symbol: P_alpha_n
    equation_latex: >-
      P_{\alpha,n}
      =
      \Pi_\alpha(
      Y_L,
      \delta_\alpha,
      \Sigma_N,
      \text{decoder},
      \text{threshold})
  policy_inputs:
    - measured_data
    - declared_question_or_residual
    - noise_model
    - decoder
    - thresholds
    - claim_tier
  binding_principle: reported_output_is_not_identical_to_the_underlying_state

upgraded_master_box:
  equation_latex: |-
    \begin{gathered}
    \delta_R\Rightarrow
    \mathscr H_T\Rightarrow
    \mathscr X_T=(\mathscr H_T\oplus\mathscr H_T),\\
    X_n=(\Phi_n,\Psi_n)^T,\qquad
    \bar O_\alpha=I_2\otimes O_\alpha,\qquad
    \bar H_\alpha=I-\bar O_\alpha,\\
    \mathbb G_T=L_R\otimes I+I\otimes C_{\mathcal F}+C_{\rm int},\\
    S_{\rm DRL}[X]=\sum_n\mathbb L^n,\qquad
    \mathcal E_{\rm DRL}[X]_n=\mathcal J_{C,n}[X_n],\\
    \rho^T\mathcal J_{C,n}[X]=0
    \quad\text{when cut conservation is claimed},\\
    \mathcal T_{n+1}
    =\mathcal T_n\oplus E_{T,n}(\bar HX_n),\\
    \mathcal K_{\alpha\leftarrow\beta}(\tau)
    =
    A_\alpha\bar O_\alpha R_\alpha
    \mathcal U_H(\tau)
    \bar H_\beta W_\beta\bar O_\beta E_\beta,\\
    y_{\alpha\leftarrow\beta}(\tau)
    =
    \mathcal K_{\alpha\leftarrow\beta}(\tau)z+\eta_\alpha,\\
    Y_L=\mathcal G_Lx_0+N_L,\qquad
    \mathcal G_L=
    \begin{pmatrix}
    C\\CF\\\vdots\\CF^L
    \end{pmatrix},\\
    \widetilde{\mathcal G}_L
    =
    \Sigma_N^{-1/2}\mathcal G_L\Sigma_x^{1/2},\\
    d_{\rm readable}^{(\kappa)}(L)
    =
    \#\{i:\sigma_i(\widetilde{\mathcal G}_L)>\kappa\},\\
    I_{\rm read}(L)
    =
    \frac12\log_2\det\left[
    I+\Sigma_x^{1/2}
    \mathcal G_L^T\Sigma_N^{-1}
    \mathcal G_L\Sigma_x^{1/2}
    \right]\;\mathrm{rbit},\\
    P_{\alpha,n}
    =
    \Pi_\alpha(
    Y_L,\delta_\alpha,\Sigma_N,\text{decoder},\text{threshold}).
    \end{gathered}
  process_chain:
    - retained_distinction
    - doubled_DRL_state
    - native_internal_dynamics
    - read_write_cut
    - hidden_evolution
    - optional_tape_record
    - return_transformation
    - physical_measurement
    - noise_conditioning
    - decoding
    - reporting_policy

