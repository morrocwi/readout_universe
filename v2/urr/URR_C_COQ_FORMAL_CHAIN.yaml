      - F2_mirror_selector_exact
      - F2_reader_record_eta
    master_equation_link: "X_n = (Phi_n, Psi_n)^T"
  F3_lifted_readout_split:
    adapter_obligation: ReadoutSplit
    theorems:
      - F3_lifted_O_idempotent
      - F3_lifted_H_idempotent
      - F3_lifted_O_after_H_zero
      - F3_lifted_H_after_O_zero
      - F3_lifted_recompose
    master_equation_link:
      - "Obar = I_2 tensor O"
      - "Hbar = I - Obar"
    limitation: split_laws_are_declared_adapter_obligations
  F4_master_projection:
    theorem: F4_master_implies_component_equations
    premise: "forall X, E_DRL X = J_C X"
    conclusions:
      - "P_Phi(E_DRL X) = P_Phi(J_C X)"
      - "P_Psi(E_DRL X) = P_Psi(J_C X)"
    master_equation_link: forced_reader_and_mirror_component_equations
  F5_cut_balance:
    theorem: F5_balanced_cut_conserves_declared_total
    state_sectors:
      - visible
      - hidden
      - tape
    exact_identity: "visible' + hidden' + tape' = visible + hidden + tape"
    limitation: positivity_and_physical_units_are_separate_adapter_obligations
  F6_append_only_tape:
    definition: append_record
    theorems:
      - F6_append_preserves_old_history_as_prefix
      - F6_append_cell_injective
      - F6_distinct_cells_make_distinct_histories
    master_equation_link: injective_growing_tape_backend
  F7_return_transformation:
    definition: K_return
    composition: >-
      A_alpha o O_read o R_alpha o U_H o H_hidden o W_beta o O_write o E_beta
    theorems:
      - F7_return_kernel_is_declared_composition
      - F7_declared_left_decoder_recovers_message
      - F7_zero_return_readout_forces_zero_direct_kernel
    limitation: decoder_and_zero_return_laws_are_explicit_premises
  F8_native_DRL_anchors:
    aliases:
      F8_native_reader_EL_anchor: T1_el_psi_node1
      F8_native_reader_EL_second_node_anchor: T1_el_psi_node2
      F8_native_mirror_EL_anchor: T1_el_phi_node1
      F8_native_three_ring_D_cancellation_anchor: T2_D_cancellation
      F8_native_general_N_D_cancellation_anchor: general_legendre_D_cancellation
  core_bundle:
